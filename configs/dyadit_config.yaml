# DyaDiT (Audio2PoseDiT) Training Configuration
# Configuration file for training Audio-to-Pose Diffusion Transformer

# Experiment settings
exp_name: no_md_test

save_dir: /home/peng/dyadic_motion/outputs
debug: false
test_first: true
seed: 222


# Logger configuration
logger:
  wandb:
    project: "dyadit_audio2pose"
    entity: -  # Replace with your wandb entity

# Trainer configuration
trainer:
  max_epochs: 2000
  accelerator: gpu
  devices: 1
  num_nodes: 1
  log_every_n_steps: 10
  precision: bf16-mixed  # 32-true, 16-mixed, bf16-mixed
  gradient_clip_val: 1.0
  strategy: ddp_find_unused_parameters_true

# Data configuration
data:
  # Dataset settings
  batch_size: 64
  num_workers: 4
  pin_memory: true
  use_6d_rotation: true
  # DyadicLoader specific settings
  data_path: data/
  # max_files: 1
  # specific_files:
    # - V00_S1819_I00001006_P1103A.npz
  samples_per_conversation: -1  # -1 means use all possible non-overlapping segments
  is_reversed: true
  

# Model configuration
model:
  # Model architecture
  pose_dim: 64
  pose_fps: 30
  model_dim: 512
  ffn_dim: 2048
  heads: 4
  layers: 4
  time_dim: 512
  audio_sr: 16000
  pose_length: 96
  mask_length: 8
  # prev_length: 96
  # Model behavior
  use_cross_attn: true
  use_rope: true
  fusion_drop: 0.2
  style_drop: 0.2
  relat_drop: 0.2
  person_drop: 0.2
  motion_other_drop: 0.2
  prev_drop: 0.2
  # Audio encoder settings
  wav2vec_layers: 1  # Number of Wav2Vec2 encoder layers to use (integer)
  
  # Memory bank settings
  motion_bank_size: 1000
  orthogonal_fusion: true

vqvae:
  nb_joints: 258
  output_emb_width: 64
  code_dim: 512
  depth: 4
  downsample_factor: 4
  checkpoint_path: /home/peng/dyadic_motion/dyadic_dit/dyadic_dit_vq/ckpt/net_best.pth

# Training configuration
training:
  # Optimizer settings
  lr: 3e-4
  weight_decay: 0.0
  betas: [0.9, 0.95]
  
  # Scheduler settings
  scheduler:
    type: cosine_with_warmup  # cosine_with_warmup, cosine, linear
    warmup_steps: 1000
    max_steps: null  # null means use max_epochs
  
  # Diffusion settings
  diffusion:
    num_train_timesteps: 1000
    objective: eps  # eps, x0, v
    scheduler_type: dpm_solver  # ddpm, ddim, dpm_solver
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: linear  # linear, scaled_linear, squaredcos_cap_v2
    variance_type: fixed_small # fixed_small, fixed_small_log, fixed_large, fixed_large_log, learned, learned_range
    clip_sample: false
    prediction_type: epsilon  # epsilon, sample, v_prediction
  
  # Regularization
  gradient_clip_val: 1.0
  
  # Checkpointing
  checkpoint:
    save_top_k: 3
    monitor: val/loss
    mode: min
    save_last: true
    every_n_epochs: 1

# Validation configuration
validation:
  val_check_interval: 1.0  # Validate every epoch
  limit_val_batches: null  # null means use all validation data

# Callbacks configuration
callbacks:
  - name: ModelCheckpoint
    save_top_k: 3
    monitor: val/loss
    mode: min
    save_last: true
    every_n_epochs: 1
    
  - name: LearningRateMonitor
    logging_interval: epoch
    
  - name: EarlyStopping
    monitor: val/loss
    patience: 10
    mode: min

# Paths configuration
paths:
  data_root: /home/peng/dyadic_motion/dyadic_dit/data
  checkpoint_dir: /home/peng/dyadic_motion/outputs/checkpoints
  log_dir: /home/peng/dyadic_motion/outputs/logs
  device: cuda
